    - generic [ref=e258]:
      - generic [ref=e259]:
        - 'heading "Realistische Quoten: ein Trichter als Größenordnung" [level=2] [ref=e260]'
        - paragraph [ref=e261]: Wir versprechen Ihnen keine Terminzahl. Der Trichter unten ist eine Beispielrechnung für einen begrenzten, gut passenden Markt – damit Sie einordnen können, was am Ende realistisch bei Ihnen ankommt. Ihre Werte hängen von Angebot, Entscheiderzahl, Preis, Anlass und Nachbearbeitung ab. Wir rechnen ihn vor Projektbeginn mit Ihnen durch.
      - 'figure "So sieht ein Monat aus, wenn die Liste stimmt: aus 200 geprüften Unternehmen werden 20 qualifizierte Termine und daraus fünf Abschlüsse." [ref=e262]':
        - img "Trichter von 200 geprüften Unternehmen über 80 Gespräche und 20 Termine zu 5 Abschlüssen" [ref=e264]:
          - generic [ref=e265]:
            - generic [ref=e267]: 200 geprüfte Unternehmen
            - generic [ref=e269]: 80 erreichte Entscheider
            - generic [ref=e271]: 20 qualifizierte Termine
            - generic [ref=e273]: 5 Abschlüsse
            - generic [ref=e274]: "Beispielrechnung als Größenordnung: 20 Termine aus 80 Gesprächen, 5 Abschlüsse aus 20 Terminen."
      - paragraph [ref=e276]:
        - text: "Eine Terminquote ohne Abschlussquote ist nur die halbe Wahrheit. Wenn Gespräche entstehen, aber keine Angebote oder Abschlüsse folgen, liegt das Problem oft nach der Kaltakquise: Übergabe, Nutzenargumentation, Angebot oder Führung. Dann prüfen wir gemeinsam, ob"
        - link "Kosten und Modelle des Vertriebsoutsourcings" [ref=e277] [cursor=pointer]:
          - /url: /vertriebsoutsourcing-kosten/
        - text: passen oder ob ein anderer Eingriff sinnvoller ist.
    - generic [ref=e279]:
      - heading "Was wir nicht machen" [level=2] [ref=e280]
      - paragraph [ref=e281]: Wir machen keine B2C-Kaltakquise, keinen Adresshandel, keine unaufgeforderten Massenmails und keine Fake-Identitäten. Wir brauchen keinen „Trick“, weil wir einen echten Grund haben – und wer gerade keinen hat, wird nicht angerufen, sondern bleibt auf Beobachtung.
      - paragraph [ref=e282]:
        - text: "Viele Teams besitzen bereits ein CRM-Scoring in HubSpot oder einer Tabelle. Dieses System bleibt bestehen. Wir schärfen es nach: Der Fit zeigt, ob ein Unternehmen grundsätzlich passt; der Anlass zeigt, ob gerade etwas passiert. Öffentliche Live-Signale ergänzen Stammdaten, Ereignisse altern in eigenen Zeitfenstern, und die Spitze wird von Hand auf Entscheider und Zusammenhang geprüft. So wird aus einem Punktwert ein tragfähiger erster Satz, auch für Unternehmen, die noch nicht in Ihrer Datenbank stehen. Mehr zur Methode finden Sie bei"
        - link "PrioX Lead-Scoring" [ref=e283] [cursor=pointer]:
          - /url: https://priox.ai/lead-scoring
        - text: ", unserer eigenen Software für diese Suche."

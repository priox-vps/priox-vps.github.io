    - generic [ref=e71]:
      - generic [ref=e72]:
        - paragraph [ref=e73]: Passt das zu Ihnen?
        - heading "Drei Sätze, die wir im Erstgespräch fast immer hören." [level=2] [ref=e74]
        - paragraph [ref=e75]: Erkennen Sie sich wieder, sind Sie hier richtig. Darunter steht jeweils, was wir dann von Ihrem Tisch nehmen.
      - generic [ref=e76]:
        - generic [ref=e77]:
          - generic [ref=e78]: "1"
          - heading "„Unsere Verkäufer telefonieren ungern – und dann kaum.“" [level=3] [ref=e79]
          - paragraph [ref=e80]: Wir übernehmen die Erstansprache komplett. Ihre Leute bekommen nur noch Termine mit Menschen, die schon wissen, worum es geht.
        - generic [ref=e81]:
          - generic [ref=e82]: "2"
          - heading "„Wir kommen nie am Vorzimmer vorbei.“" [level=3] [ref=e83]
          - paragraph [ref=e84]: "Unsere intelligente signal-basierte Ansprache macht aus dem kalten Call einen warmen: In der Regel wissen wir vor dem Anruf, wer zuständig ist und was diese Person gerade beschäftigt – oft samt Durchwahl und Mailadresse. Dann steht die Zentrale gar nicht erst dazwischen. Und wenn doch, fragen wir mit Namen und einem Grund, den sie sofort versteht."
        - generic [ref=e85]:
          - generic [ref=e86]: "3"
          - heading "„Beim letzten Dienstleister kamen Termine, aber keine Kunden.“" [level=3] [ref=e87]
          - paragraph [ref=e88]: Wir legen vorher schriftlich fest, wann ein Termin zählt – Zuständigkeit, Bedarf, Zeitpunkt. Was das nicht erfüllt, buchen wir nicht.
      - paragraph [ref=e89]:
        - text: Passt das nicht, sagen wir das im Erstgespräch. Wenn Ihr Angebot noch unklar positioniert ist, holt auch der beste Anruf nichts heraus – dann ist
        - link "Beratung" [ref=e90] [cursor=pointer]:
          - /url: /vertriebsberatung/
        - text: der erste Schritt, nicht mehr Anrufvolumen. Brauchen Sie Recherche, Ansprache und Terminierung in einem breiteren Rahmen, passt die
        - link "Neukundenakquise-Agentur" [ref=e91] [cursor=pointer]:
          - /url: /neukundenakquise-agentur/
        - text: besser.

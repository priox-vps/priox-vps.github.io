    - generic [ref=e195]:
      - generic [ref=e196]:
        - heading "Wann wir anrufen" [level=2] [ref=e197]
        - paragraph [ref=e198]:
          - text: "Ob ein Anruf abgewürgt wird oder in ein Gespräch führt, liegt nicht immer am Verkäufer. Es liegt am Zeitpunkt. Deshalb suchen wir vor jeder Ansprache erst den Anlass: eine Stellenausschreibung, einen Führungswechsel, einen neuen Standort, eine Finanzierung. Nachlesen kann das nicht jeder – die Daten liegen über Millionen von Quellen verstreut. Unser"
          - link "Central-Sales-Intelligence-System" [ref=e199] [cursor=pointer]:
            - /url: https://priox.ai/
          - text: wertet sie laufend aus und meldet uns den Moment, in dem Ihr Thema bei dem Angerufenen ohnehin gerade auf dem Tisch liegt.
        - paragraph [ref=e200]: "Für Sie hat das noch einen zweiten Nutzen: Ihre Zielkundenliste ist endlich. Wer gerade keinen Grund hat, bleibt auf Beobachtung, statt mit einem beliebigen Pitch verbrannt zu werden."
      - generic [ref=e201]:
        - generic [ref=e202]:
          - heading "Mehr als 40 Anlässe – und wenn es 100 sein müssen, sind es 100" [level=3] [ref=e203]
          - paragraph [ref=e204]: Wie viele es in Ihrem Projekt werden, entscheidet Ihr Markt, nicht unser Katalog. Welche Ereignisse das sind, was dahintersteckt und wie lange das Zeitfenster jeweils offen steht, haben wir aufgeschrieben – samt der Wunsch-Signale, die wir für Sie ergänzen.
          - paragraph [ref=e205]:
            - link "Zum Signalkatalog →" [ref=e206] [cursor=pointer]:
              - /url: /signal-based-selling/
        - generic [ref=e207]:
          - heading "Warum der erste Satz sitzt" [level=3] [ref=e208]
          - paragraph [ref=e209]: In den ersten Satz gehört genau ein Ereignis – das, welches den Angerufenen gerade selbst beschäftigt. Kein Pitch, keine Aufzählung, kein Hinweis darauf, was wir sonst noch wissen. Deshalb hört man uns zu.
    - generic [ref=e211]:
      - generic [ref=e212]:
        - 'heading "Qualitätskriterien: woran Sie eine seriöse Kaltakquise-Agentur erkennen" [level=2] [ref=e213]'
        - paragraph [ref=e214]: Sie geben einem Fremden Zugang zu Ihren Wunschkunden. Prüfen Sie uns an diesen Punkten – und jeden anderen Anbieter genauso.

        - heading "Was Ihre Wunschkunden von uns zu hören bekommen" [level=2] [ref=e156]
        - paragraph [ref=e157]: Das hier hört Ihr Wunschkunde, wenn wir anrufen. Kein erfundener „wir kennen uns doch“-Einstieg, sondern der öffentliche Anlass, ein klarer Bezug und Raum für ein Nein. Im ersten Satz wird nichts verkauft – er soll nur die nächste Frage verdienen.

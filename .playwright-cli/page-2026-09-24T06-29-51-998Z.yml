        - paragraph [ref=e95]: Passt das zu Ihnen?
        - heading "Drei Sätze, die wir im Erstgespräch fast immer hören." [level=2] [ref=e96]
        - paragraph [ref=e97]: Erkennen Sie sich in einem davon wieder, sind Sie hier richtig. Darunter steht jeweils, was wir dann konkret von Ihrem Tisch nehmen.

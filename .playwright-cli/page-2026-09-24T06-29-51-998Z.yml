          - heading "„Wir suchen einen Vertriebler – und finden keinen.“" [level=3] [ref=e105]
          - paragraph [ref=e106]: "Wir stellen das Akquise-Team: ohne Stellenanzeige, Einarbeitung und Ausfallrisiko. Start in zwei bis vier Wochen statt in sechs Monaten."
        - generic [ref=e107]:
          - generic [ref=e108]: "3"
          - heading "„Termine haben wir. Nur die falschen.“" [level=3] [ref=e109]
          - paragraph [ref=e110]: "Wir qualifizieren vor: Zuständigkeit, Budgetrahmen, Zeitpunkt. Was nicht passt, kommt gar nicht erst in Ihren Kalender."

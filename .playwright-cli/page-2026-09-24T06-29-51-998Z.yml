    - generic [ref=e201]:
      - generic [ref=e202]:
        - paragraph [ref=e203]: Warum DEALMAKERS
        - heading "Bei uns rufen keine Anfänger an." [level=2] [ref=e204]
        - paragraph [ref=e205]: "Die übliche Schwachstelle ausgelagerter Akquise ist nicht das Konzept, sondern die Besetzung: Recherche und Strategie kommen vom Erfahrenen, ans Telefon geht jemand mit sechs Wochen Einarbeitung. Bei uns telefoniert der, der es kann."
      - generic [ref=e206]:
        - generic [ref=e207]:
          - heading "Langjährige Vertriebspraxis" [level=3] [ref=e208]
          - paragraph [ref=e209]: Die Menschen, mit denen wir arbeiten, verkaufen seit Jahren im B2B – nicht seit einem Onlinekurs. Sie halten ein Gespräch mit einem Geschäftsführer aus, auch wenn es vom Leitfaden abweicht.
        - generic [ref=e210]:
          - heading "Einwände live, nicht im Nachgang" [level=3] [ref=e211]
          - paragraph [ref=e212]: Wer den Markt kennt, hört am Tonfall, ob ein „kein Bedarf“ ein Ende ist oder eine Rückfrage. Genau dort entstehen die Termine, die ein Skript nicht holt.
        - generic [ref=e213]:
          - heading "Besetzung vor Geschwindigkeit" [level=3] [ref=e214]
          - paragraph [ref=e215]: Wir starten Ihr Projekt erst, wenn die passende Person frei ist. Das kostet manchmal zwei Wochen – und spart Ihnen ein Quartal verbrannter Zielkunden.
      - paragraph [ref=e216]: Wen wir für Ihr Projekt vorsehen, besprechen wir vorab mit Ihnen – nicht erst, wenn die ersten Berichte kommen.
      - generic [ref=e217]:
        - paragraph [ref=e218]: Unser Methodenhandbuch
        - generic [ref=e219]:
          - figure [ref=e220]:
            - img "Das Methodenhandbuch The Magic of Sales – Emotional Resonance® von Florian Weippert" [ref=e222]
          - generic [ref=e223]:
            - paragraph [ref=e224]:
              - text: "Wie wir Gespräche führen, ist nicht Bauchgefühl, sondern aufgeschrieben: 383 Seiten, entstanden aus knapp zwanzig Jahren Vertriebspraxis – das Handbuch, aus dem unsere Anrufer und unsere Trainings arbeiten."
              - link "Mehr dazu unter „Warum DEALMAKERS“" [ref=e225] [cursor=pointer]:
                - /url: /warum-wir/#die-methode-steht-geschrieben
              - text: .
            - paragraph [ref=e226]: 383 Seiten · Emotional Resonance® · Grundlage jedes Gesprächs
    - generic [ref=e228]:
      - generic [ref=e229]:
        - paragraph [ref=e230]: Wann wir anrufen
        - heading "Wir rufen an, wenn etwas passiert ist." [level=2] [ref=e231]
        - paragraph [ref=e232]: "Ob ein Anruf abgewürgt wird oder in ein Gespräch führt, liegt nicht immer am Verkäufer. Es liegt am Zeitpunkt. Deshalb suchen wir vor jeder Ansprache erst den Anlass: eine Stellenausschreibung, einen Führungswechsel, einen neuen Standort, eine Finanzierung. Dann ist Ihr Angebot beim Angerufenen ohnehin schon Thema."
        - paragraph [ref=e233]:
          - text: "Nachlesen kann das nicht jeder: Die Daten liegen über Millionen von Quellen verstreut. Unser"
          - link "Central-Sales-Intelligence-System" [ref=e234] [cursor=pointer]:
            - /url: https://priox.ai/
          - text: "wertet sie für jede Zielfirma laufend aus – die Social-Media-Profile und Beiträge Ihres Gesprächspartners, Unternehmensnachrichten, Stellenausschreibungen, Register- und Presseeinträge. Daraus entsteht pro Kontakt ein Bild: wer die Person ist, was das Unternehmen gerade beschäftigt und welches Ereignis genau jetzt einen Anruf trägt. Zusammengesetzt hat diese Einzelteile sonst niemand – und von außen sieht man einer Firma nicht an, was wir dabei gefunden haben."
      - figure "Der erste Satz entscheidet über die nächsten zehn Minuten. Ein Anlass macht ihn überprüfbar – und damit schwer abzuwimmeln." [ref=e235]:
        - 'img "Vergleich zweier Gesprächseinstiege: ohne Anlass und mit einem öffentlich nachprüfbaren Anlass" [ref=e237]':

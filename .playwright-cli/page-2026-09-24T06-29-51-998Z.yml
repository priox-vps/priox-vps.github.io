          - paragraph [ref=e262]: Wie viele es bei Ihnen werden, entscheidet Ihr Markt, nicht unser Katalog. Welche Ereignisse das im Einzelnen sind, welche Bedeutung dahintersteckt und wie lange das Zeitfenster jeweils offen steht, haben wir aufgeschrieben.

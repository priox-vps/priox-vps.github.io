    - generic [ref=f3e102]:
      - generic [ref=f3e103]:
        - paragraph [ref=f3e104]: Das Transferproblem
        - heading "Warum die meisten Vertriebstrainings nichts ändern" [level=2] [ref=f3e105]
      - generic [ref=f3e106]:
        - generic [ref=f3e107]:
          - heading "Der Fall ist erfunden" [level=3] [ref=f3e108]
          - paragraph [ref=f3e109]: Im Rollenspiel weiß jeder, dass der Kollege gleich widersprechen soll. Das trainiert Höflichkeit, nicht Reaktion. Am Montag ist der echte Kunde, die echte Branche und der echte Einwand wieder da. Deshalb stehen im Training Zielkunden, Gesprächsnotizen und vorhandene Angebote auf dem Tisch.
        - generic [ref=f3e110]:
          - heading "Der Transfer fehlt" [level=3] [ref=f3e111]
          - paragraph [ref=f3e112]: Ein guter Satz im Seminarraum ist noch kein guter Satz am Hörer. Ohne Vorbereitung des nächsten Calls, Beobachtung und Rückmeldung bleibt das Wissen bei der Folie. Wir übersetzen jede Erkenntnis in einen konkreten nächsten Gesprächsschritt.
        - generic [ref=f3e113]:
          - heading "Der eine Tag endet zu früh" [level=3] [ref=f3e114]
          - paragraph [ref=f3e115]: Ein Tag kann Begriffe klären und Verhalten anstoßen. Er ersetzt keine Wiederholung. Wenn nach dem Training keine Gespräche besprochen werden, setzt sich das alte Muster oft durch. Deshalb gehört bei Bedarf eine kurze Nachbegleitung dazu.
      - 'figure "Die Kurven sind eine Darstellung des Prinzips, keine gemessene Studie: Wiederholung an echten Gesprächen hält neue Routinen im Einsatz." [ref=f3e116]':
        - img "Vergessenskurve ohne und mit Nachbegleitung nach einem Training" [ref=f3e118]:

          - text: "heißt: Nicht die Liste bestimmt, wen man anruft, sondern das Ereignis. Die deutsche Entsprechung lautet anlassbezogene Ansprache."
      - paragraph [ref=f3e213]: Für ein Telefontraining B2B sind nicht alle Anlässe gleich nützlich. Die folgende Auswahl deutet eher auf ein Können- als auf ein Kapazitätsproblem im Vertrieb hin. Sie dient im Training als Material für Einstiege, Fragen und Einwände.

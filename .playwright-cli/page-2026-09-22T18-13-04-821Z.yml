      - generic [ref=f3e382]:
        - paragraph [ref=f3e383]: Vom Vorgespräch bis zur Nachkontrolle
        - heading "So läuft ein Training ab" [level=2] [ref=f3e384]
      - list [ref=f3e385]:
        - listitem [ref=f3e386]:
          - strong [ref=f3e387]: "Vorgespräch:"
          - text: Wir klären Angebot, Zielkunden, typische Gesprächssituationen und die Frage, an der das Team gerade hängt.
        - listitem [ref=f3e388]:
          - strong [ref=f3e389]: "Material vorbereiten:"
          - text: Sie bringen Zielkundenliste, Gesprächsnotizen, E-Mails und vorhandene Argumentation ein. Daraus wählen wir echte Fälle.
        - listitem [ref=f3e390]:
          - strong [ref=f3e391]: "Training durchführen:"
          - text: Einstieg, Fragen, Einwände und Abschluss werden trainiert. Bei vereinbarter Live-Telefonie telefoniert der Trainer vor und erklärt die Entscheidungen danach.
        - listitem [ref=f3e392]:
          - strong [ref=f3e393]: "Nächste Gespräche festlegen:"
          - text: Jeder Teilnehmer verlässt den Termin mit konkreten Kontakten, einem Opener und einem nächsten Schritt.
        - listitem [ref=f3e394]:
          - strong [ref=f3e395]: "Nachkontrolle:"
          - text: Ausgewählte Gespräche werden besprochen. Wir unterscheiden dabei Gesprächstechnik von Problemen in Liste, Angebot oder Prozess.
      - paragraph [ref=f3e396]:
        - text: Wenn nicht Können, sondern schlicht Kapazität fehlt, ist eine
        - link "Telefonakquise-Agentur" [ref=f3e397] [cursor=pointer]:
          - /url: /telefonakquise-agentur/
        - text: oder eine
        - link "Kaltakquise-Agentur" [ref=f3e398] [cursor=pointer]:
          - /url: /kaltakquise-agentur/
        - text: oft die ehrlichere Antwort. Für die Frage, wie Angebot, Prozess und Mannschaft zusammenspielen, ist
        - link "Vertriebsberatung" [ref=f3e399] [cursor=pointer]:
          - /url: /vertriebsberatung/
        - text: die passende Vertiefung.
    - generic [ref=f3e401]:
      - generic [ref=f3e402]:
        - paragraph [ref=f3e403]: Nicht nur Stimmung abfragen
        - heading "Wie wir Wirkung messen" [level=2] [ref=f3e404]
        - paragraph [ref=f3e405]: Ein Training ist dann wirksam, wenn Verhalten im nächsten Gespräch erkennbar anders ist und ein sauberer nächster Schritt entsteht.
      - generic [ref=f3e406]:
        - generic [ref=f3e407]:
          - heading "Vorher und nachher hören" [level=3] [ref=f3e408]
          - paragraph [ref=f3e409]: "Wir vergleichen ausgewählte Gespräche nach klaren Kriterien: Anlass im Einstieg, Anzahl und Qualität der Fragen, Umgang mit Einwänden, Gesprächsanteil und Vereinbarung eines nächsten Schritts. Das ist aussagekräftiger als eine allgemeine Zufriedenheitsfrage direkt nach dem Seminar."
        - generic [ref=f3e410]:
          - heading "Ergebnisse richtig einordnen" [level=3] [ref=f3e411]
          - paragraph [ref=f3e412]: Termine und Angebote werden mit betrachtet, aber nicht isoliert dem Training zugeschrieben. Zielkundenqualität, Preis, Markt und Erreichbarkeit wirken mit. Der Vergleich zeigt, ob das Team seine vereinbarte Arbeitsweise nutzt und wo das nächste Hindernis liegt.

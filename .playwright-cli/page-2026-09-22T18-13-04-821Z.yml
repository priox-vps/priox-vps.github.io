      - paragraph [ref=f3e254]: Beispiele, keine abschließende Liste.
      - paragraph [ref=f3e255]: "Wunsch-Signale entstehen aus dem Markt des Kunden: ein auslaufender Rahmenvertrag, eine verlorene Zertifizierung, eine Normänderung oder der Wegfall einer Förderung. Sie werden vor dem Training gemeinsam präzisiert, weil nur das Team selbst einschätzen kann, welches Ereignis einen echten Gesprächsgrund liefert."
      - paragraph [ref=f3e256]:
        - text: Manche Teams haben bereits ein Scoring im CRM, in HubSpot oder in einer Tabelle. Das System bleibt bestehen; wir schärfen es für die Trainingsarbeit nach, indem Fit und aktueller Anlass getrennt betrachtet werden. Live-Signale altern, und für die Spitze wird aus der Recherche ein erster Satz. Wer diese Priorisierung im eigenen Team vertiefen will, findet sie bei
        - link "PrioX Lead-Scoring" [ref=f3e257] [cursor=pointer]:
          - /url: https://priox.ai/lead-scoring
        - text: ; die Software hat DEALMAKERS selbst gebaut und setzt sie selbst ein.

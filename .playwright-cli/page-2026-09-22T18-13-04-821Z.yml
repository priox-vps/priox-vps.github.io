    - generic [ref=f3e135]:
      - generic [ref=f3e136]:
        - paragraph [ref=f3e137]: Die Grundlage
        - heading "Das Handbuch hinter dem Training" [level=2] [ref=f3e138]
      - generic [ref=f3e139]:
        - figure [ref=f3e140]:
          - img "Das Methodenhandbuch The Magic of Sales – Emotional Resonance von Florian Weippert" [ref=f3e142]
        - generic [ref=f3e143]:
          - paragraph [ref=f3e144]:
            - text: "Ein Training ist so gut wie das System dahinter. Unseres ist aufgeschrieben: 383 Seiten, entstanden 2021, zuletzt im November 2022 überarbeitet."
            - emphasis [ref=f3e145]: The Magic of Sales – Emotional Resonance
            - text: ordnet, was in knapp zwanzig Jahren B2B-Vertrieb tatsächlich funktioniert hat – Psychologie des Kaufentscheids, Gesprächsaufbau, Fragetechnik, Einwände, Verhandlung.
          - paragraph [ref=f3e146]: "Das Buch war nie im Handel; es ist kein Verlagsprojekt, sondern unser Arbeitsmittel. Für Sie heißt das: Die sechs Bausteine unten sind kein Seminarkonzept, das für Sie neu zusammengestellt wurde, sondern ein Auszug aus einem System, das seit Jahren im Einsatz ist und laufend an echten Gesprächen korrigiert wird."
          - paragraph [ref=f3e147]: Florian Weippert · 383 Seiten · Fassung November 2022
    - generic [ref=f3e149]:
      - generic [ref=f3e150]:
        - paragraph [ref=f3e151]: Vertriebstraining B2B
        - heading "Die sechs Trainingsbausteine" [level=2] [ref=f3e152]
        - paragraph [ref=f3e153]: Wir trainieren das Gespräch als Abfolge. Jede Formulierung muss zum Angebot, zum Ansprechpartner und zum nächsten Schritt passen.
      - generic [ref=f3e154]:
        - generic [ref=f3e155]:
          - heading "1. Einstieg und Opener" [level=3] [ref=f3e156]
          - paragraph [ref=f3e157]: "Der Einstieg nennt den Anlass und bittet um eine kurze Einordnung: „Sie haben für Ihren Standort in Wien zwei Vertriebsstellen ausgeschrieben. Ich möchte verstehen, ob Sie den Aufbau intern stemmen oder dafür gerade externe Unterstützung prüfen.“ Kein allgemeiner Nutzen-Satz vor der Frage."
        - generic [ref=f3e158]:
          - heading "2. Vorzimmer und Erreichbarkeit" [level=3] [ref=f3e159]
          - paragraph [ref=f3e160]: "Am Vorzimmer hilft Klarheit: „Es geht um den angekündigten Standort in Wien und eine Frage zur Vertriebsorganisation. Wer verantwortet das bei Ihnen?“ Bei Rückrufbarrieren trainieren wir Zeitfenster, Namen und eine Notiz, die dem Entscheider einen Grund gibt zurückzurufen."
        - generic [ref=f3e161]:
          - heading "3. Bedarfsanalyse mit Fragetechnik" [level=3] [ref=f3e162]
          - paragraph [ref=f3e163]: "Statt zu präsentieren, wird die Lage geklärt: „Woran merken Sie heute, dass der Vertriebsaufbau funktioniert?“ Danach: „Wo geht aktuell Zeit verloren?“ und „Wer entscheidet mit, wenn Sie daran etwas ändern?“ Fragen sollen eine Entscheidung sichtbar machen, nicht einen Fragenkatalog erfüllen."
        - generic [ref=f3e164]:
          - heading "4. Einwandbehandlung" [level=3] [ref=f3e165]
          - paragraph [ref=f3e166]: "Einwand zuerst prüfen: „Wenn Sie sagen, kein Bedarf: Ist das Thema grundsätzlich erledigt oder nur für dieses Quartal nicht auf Ihrer Liste?“ Erst nach der Antwort folgt eine Erwiderung. So wird aus dem Reflex eine belastbare Information."
        - generic [ref=f3e167]:
          - heading "5. Preisgespräch" [level=3] [ref=f3e168]
          - paragraph [ref=f3e169]: "Der Preis steht nicht allein: „Bevor wir über einen Rahmen sprechen: Was würde es intern kosten, wenn die offenen Regionen noch ein Quartal ohne klare Ansprache bleiben?“ Das ist keine Fangfrage. Es klärt, ob überhaupt ein wirtschaftliches Problem vorliegt."
        - generic [ref=f3e170]:
          - heading "6. Nachfassen und Abschluss" [level=3] [ref=f3e171]
          - paragraph [ref=f3e172]: "Nachfassen knüpft an eine Vereinbarung an: „Sie wollten die Unterlagen mit Ihrer Vertriebsleitung prüfen. Passt es, wenn wir am Donnerstag um 10 Uhr zehn Minuten abgleichen?“ Der Abschluss ist ein fester Schritt mit Termin, Beteiligten und Zweck."
    - generic [ref=f3e174]:
      - generic [ref=f3e175]:
        - paragraph [ref=f3e176]: Einstieg trainieren
        - heading "Der erste Satz" [level=2] [ref=f3e177]
        - paragraph [ref=f3e178]: Der erste Satz macht aus einer Liste einen Gesprächsgrund. Trainiert wird, aus einem öffentlich sichtbaren Auslöser eine sachliche Eröffnung zu bauen.
      - table [ref=f3e180]:
        - rowgroup [ref=f3e181]:
          - row [ref=f3e182]:
            - columnheader "Auslöser" [ref=f3e183]
            - columnheader "Möglicher Eröffnungssatz" [ref=f3e184]
        - rowgroup [ref=f3e185]:
          - row [ref=f3e186]:
            - cell "Zwei neue Vertriebsstellen in Wien" [ref=f3e187]
            - cell "„Sie haben letzte Woche zwei Stellen für den Vertrieb in Wien ausgeschrieben. Wie organisieren Sie den Marktstart, bis das Team vollständig besetzt ist?“" [ref=f3e188]
          - row [ref=f3e189]:
            - cell "Neue Vertriebsleitung angekündigt" [ref=f3e190]
            - cell "„Ihre neue Vertriebsleitung hat den Start öffentlich angekündigt. Welche Themen stehen in den ersten Monaten im Vertrieb ganz oben?“" [ref=f3e191]
          - row [ref=f3e192]:
            - cell "Neuer Standort eröffnet" [ref=f3e193]
            - cell "„Sie haben den neuen Standort in Leipzig eröffnet. Wer bündelt dort gerade die Ansprache neuer Geschäftskunden?“" [ref=f3e194]
          - row [ref=f3e195]:
            - cell "Produktstart mit Datum" [ref=f3e196]
            - cell "„Für Ihr neues Produkt ist der Marktstart im Oktober angekündigt. Wie weit ist die Ansprache der ersten Zielgruppe vorbereitet?“" [ref=f3e197]
          - row [ref=f3e198]:
            - cell "Finanzierungsrunde kommuniziert" [ref=f3e199]
            - cell "„Sie haben die Finanzierungsrunde im Juni veröffentlicht. Welche Vertriebsziele sollen damit als Nächstes beschleunigt werden?“" [ref=f3e200]
          - row [ref=f3e201]:
            - cell "Neue Partnerschaft veröffentlicht" [ref=f3e202]
            - cell "„Die Partnerschaft mit Ihrem neuen Technologieanbieter wurde diese Woche bekanntgegeben. Wer verantwortet, daraus neue Kundengespräche zu entwickeln?“" [ref=f3e203]
      - paragraph [ref=f3e204]: Der Satz nennt immer den konkreten, öffentlich einsehbaren Anlass, nie das Muster dahinter. „Sie posten seit Monaten weniger“ wirkt überwacht; „Sie haben letzte Woche zwei Stellen in Wien ausgeschrieben“ wirkt aufmerksam, weil der Angerufene das Ereignis selbst kennt. Ausgewertet werden ausschließlich öffentlich zugängliche Quellen.
      - paragraph [ref=f3e205]: "Seniorität ist praktisch: Der Trainer telefoniert vor, weil er selbst seit Jahren B2B-Gespräche führt. Das Team hört einen echten Anfang, bespricht ihn unmittelbar und übernimmt keine ungetestete Theorie."
    - generic [ref=f3e207]:
      - generic [ref=f3e208]:
        - paragraph [ref=f3e209]: Zielkunden priorisieren
        - heading "Anlassbezogene Ansprache statt Listenroutine" [level=2] [ref=f3e210]
        - paragraph [ref=f3e211]:

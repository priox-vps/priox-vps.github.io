        - heading "Bei uns rufen keine Anfänger an." [level=2] [ref=f5e479]
        - paragraph [ref=f5e480]: "Die übliche Schwachstelle ausgelagerter Akquise ist nicht das Konzept, sondern die Besetzung: Recherche und Strategie kommen vom Erfahrenen, ans Telefon geht jemand mit sechs Wochen Einarbeitung. Wir machen das anders – aus einem Netzwerk, das über Jahre entstanden ist."
      - generic [ref=f5e481]:
        - generic [ref=f5e482]:
          - heading "Langjährige Vertriebspraxis" [level=3] [ref=f5e483]
          - paragraph [ref=f5e484]: Die Menschen, mit denen wir arbeiten, verkaufen seit Jahren im B2B – nicht seit einem Onlinekurs. Sie halten ein Gespräch mit einem Geschäftsführer aus, auch wenn es vom Leitfaden abweicht.
        - generic [ref=f5e485]:

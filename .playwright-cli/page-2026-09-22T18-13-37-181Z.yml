          - paragraph [ref=f5e566]: "Bei den obersten Treffern schaut ein Mensch nach: Wer entscheidet dort wirklich, was hat diese Person selbst öffentlich gesagt, welche Signale hängen zusammen. Das Ergebnis ist kein Punktwert, sondern ein erster Satz, der sitzt."

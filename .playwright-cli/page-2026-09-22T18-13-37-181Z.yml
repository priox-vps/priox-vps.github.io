      - paragraph [ref=f5e87]: Die Nennung beschreibt ausschließlich den beruflichen Werdegang und begründet keine Aussage über eine aktuelle Geschäftsbeziehung, Partnerschaft oder Empfehlung. Alle genannten Marken- und Unternehmensnamen sind Eigentum der jeweiligen Rechteinhaber.
    - generic [ref=f5e89]:
      - generic [ref=f5e90]:
        - paragraph [ref=f5e91]: Das eigentliche Problem
        - heading "Zu wenig Termine ist selten ein Fleißproblem." [level=2] [ref=f5e92]
        - paragraph [ref=f5e93]: In fast jedem Vertrieb, den wir übernehmen, finden wir dieselben drei Ursachen – und keine davon lässt sich mit „mehr telefonieren“ lösen.
      - generic [ref=f5e94]:
        - generic [ref=f5e95]:
          - generic [ref=f5e96]: "1"
          - heading "Die Liste ist beliebig" [level=3] [ref=f5e97]
          - paragraph [ref=f5e98]: Angerufen wird, wer in der Datenbank steht. Ohne Anlass ist jeder Anruf ein Kaltstart – und der Gegenüber hat keinen Grund, gerade jetzt zuzuhören.
        - generic [ref=f5e99]:
          - generic [ref=f5e100]: "2"
          - heading "Der Einstieg ist austauschbar" [level=3] [ref=f5e101]
          - paragraph [ref=f5e102]: „Wir helfen Unternehmen, effizienter zu werden“ klingt bei allen gleich. Der erste Satz entscheidet, ob das Gespräch stattfindet oder nicht.
        - generic [ref=f5e103]:
          - generic [ref=f5e104]: "3"
          - heading "Niemand bleibt dran" [level=3] [ref=f5e105]
          - paragraph [ref=f5e106]: Der Großteil der Abschlüsse entsteht nach mehreren Kontakten. Abgebrochen wird meist nach dem zweiten – genau dort, wo die Konkurrenz aufhört.
    - generic [ref=f5e108]:
      - generic [ref=f5e109]:
        - paragraph [ref=f5e110]: Unsere Arbeitsweise
        - heading "Wir rufen an, wenn etwas passiert ist." [level=2] [ref=f5e111]
        - paragraph [ref=f5e112]: "Der Unterschied zwischen einem Anruf, der abgewürgt wird, und einem, der in ein Gespräch führt, liegt fast nie am Verkäufer. Er liegt am Zeitpunkt. Deshalb steht bei uns vor jeder Ansprache die Frage: Was ist bei diesem Unternehmen gerade passiert, das unser Angebot relevant macht?"
      - figure "Der erste Satz entscheidet über die nächsten zehn Minuten. Ein Anlass macht ihn überprüfbar – und damit schwer abzuwimmeln." [ref=f5e113]:
        - 'img "Vergleich zweier Gesprächseinstiege: ohne Anlass und mit einem öffentlich nachprüfbaren Anlass" [ref=f5e115]':
          - generic [ref=f5e116]:
            - generic [ref=f5e117]: OHNE ANLASS
            - generic [ref=f5e120]: „Guten Tag, wir helfen
            - generic [ref=f5e121]: Unternehmen wie Ihrem dabei,
            - generic [ref=f5e122]: effizienter zu werden.“
            - generic [ref=f5e123]: Austauschbar. Der Gegenüber
            - generic [ref=f5e124]: hat keinen Grund für ein Jetzt.
            - generic [ref=f5e125]: MIT ANLASS
            - generic [ref=f5e128]: „Sie bauen gerade Vertrieb in
            - generic [ref=f5e129]: Österreich auf – zwei Stellen
            - generic [ref=f5e130]: sind seit letzter Woche online.“
            - generic [ref=f5e131]: Überprüfbar, konkret, und eine
            - generic [ref=f5e132]: Frage, die man beantworten will.
            - generic [ref=f5e133]: Derselbe Anrufer. Dieselbe Liste. Dieselbe Uhrzeit.
            - generic [ref=f5e134]: Nur der erste Satz ist ein anderer.
            - generic [ref=f5e135]: Beispielhafte Formulierungen aus laufenden Projekten, sinngemäß wiedergegeben.
      - paragraph [ref=f5e137]:
        - text: "Ein Anlass ist keine Vermutung, sondern etwas, das jeder nachlesen kann: eine Stellenausschreibung, ein Handelsregistereintrag, ein Jahresabschluss, eine Pressemeldung, ein öffentlicher Beitrag. Welche Ereignisse das im Einzelnen sind, steht"
        - link "im Signalkatalog weiter unten" [ref=f5e138] [cursor=pointer]:
          - /url: "#signal-based-selling"
        - text: – mit rund vierzig Beispielen aus der Praxis.
      - paragraph [ref=f5e140]:
        - strong [ref=f5e141]: Wo wir bewusst aufhören.
        - text: Wir werten ausschließlich öffentlich zugängliche Quellen aus. Und wir sprechen einen Anlass nie so an, dass er nach Beobachtung klingt. „Ihre Vertriebsleiterin ist seit drei Monaten deutlich stiller geworden“ mag stimmen – man sagt es trotzdem nicht. In den Eröffnungssatz gehört ein einzelnes, offen kommuniziertes Ereignis, mehr nicht.
    - generic [ref=f5e143]:
      - generic [ref=f5e144]:
        - paragraph [ref=f5e145]: Signal Based Selling
        - 'heading "Signal Based Selling: rund 40 Anlässe, die wir auswerten" [level=2] [ref=f5e146]'
        - paragraph [ref=f5e147]: "Signal Based Selling heißt: Nicht die Liste bestimmt, wen man anruft, sondern das Ereignis. Statt eine Zielkundenliste von oben nach unten abzutelefonieren, wartet man auf ein öffentlich sichtbares Ereignis beim Wunschkunden – und ruft erst dann an. Ein deutsches Wort dafür hat sich nicht eingebürgert; am nächsten kommt „anlassbezogene Ansprache“."
      - paragraph [ref=f5e148]: "Der Unterschied ist nicht akademisch. Bei einer Liste ist der Zeitpunkt zufällig, und Zufall bedeutet in aller Regel: gerade kein Thema. Bei einem Anlass ist der Zeitpunkt die halbe Miete – die Firma beschäftigt sich ohnehin schon mit dem Thema, über das wir sprechen wollen. Deshalb sammeln wir vor jedem Projekt erst die Anlässe und dann die Adressen, nie umgekehrt."
      - figure "Öffentliche Quellen werden gegen Ihr Wunschkundenprofil gelegt. Übrig bleibt eine kurze Liste mit Anrufgrund – und der Rest wartet, bis sich etwas tut." [ref=f5e149]:
        - img "Aus vielen öffentlichen Quellen entsteht eine sortierte Anrufliste" [ref=f5e151]:

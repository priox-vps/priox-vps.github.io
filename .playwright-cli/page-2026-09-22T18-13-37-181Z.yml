          - paragraph [ref=f5e487]: Wer den Markt kennt, erkennt am Tonfall, ob ein „kein Bedarf“ ein Ende ist oder eine Rückfrage. Genau dort entstehen die Termine, die ein Skript nicht holt.
        - generic [ref=f5e488]:
          - heading "Besetzung vor Geschwindigkeit" [level=3] [ref=f5e489]
          - paragraph [ref=f5e490]: Wir starten ein Projekt erst, wenn die passende Person frei ist. Das kostet manchmal zwei Wochen – und spart Ihnen ein Quartal verbrannter Zielkunden.
      - paragraph [ref=f5e491]: Je nach Branche und Sprache setzen wir feste Partner aus diesem Netzwerk ein. Wen wir für Ihr Projekt vorsehen, besprechen wir vorab – nicht erst, wenn die ersten Berichte kommen.

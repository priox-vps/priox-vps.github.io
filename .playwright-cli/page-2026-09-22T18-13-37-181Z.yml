      - paragraph [ref=f5e411]: 40 Beispiele, keine abschließende Liste. Kein Unternehmen braucht alle davon – in den meisten Projekten tragen fünf bis acht Signale den Großteil der Termine.
      - 'heading "Wunsch-Signale: die, die nur in Ihrem Markt etwas bedeuten" [level=3] [ref=f5e412]'
      - paragraph [ref=f5e413]:
        - text: Die Liste oben ist der allgemeine Teil. Interessanter wird es, wenn wir gemeinsam festlegen, was in
        - emphasis [ref=f5e414]: Ihrem
        - text: "Markt ein Kaufsignal ist. Das sind fast immer andere Ereignisse als die offensichtlichen: ein bestimmter Zertifikatsverlust, das Auslaufen eines Rahmenvertrags, der Wegfall einer Förderung, eine Änderung in einer Norm, ein Personalwechsel auf einer sehr speziellen Position. Solche Wunsch-Signale definieren Sie – wir bauen die Auswertung dazu. Eine feste Obergrenze gibt es nicht."
      - paragraph [ref=f5e416]:
        - strong [ref=f5e417]: Und die Technik dahinter?
        - text: Für die laufende Auswertung nutzen wir
        - link "PrioX" [ref=f5e418] [cursor=pointer]:
          - /url: https://priox.ai/
        - text: – die Software, die wir selbst entwickelt haben und betreiben. Sie beobachtet die öffentlichen Quellen, erkennt die Muster und legt jeden Morgen eine sortierte Liste hin. Wenn Sie bereits ein eigenes Vertriebsteam haben und nur die Priorisierung fehlt, ist PrioX allein oft der bessere Weg – dann brauchen Sie keine Agentur, sondern bessere Reihenfolge.
    - generic [ref=f5e420]:

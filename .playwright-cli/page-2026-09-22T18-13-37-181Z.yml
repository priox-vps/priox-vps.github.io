          - paragraph [ref=f5e560]: "Bewertet wird, was öffentlich passiert: Stellenausschreibungen, Führungswechsel, neue Standorte, Finanzierungen, Produktstarts, Presse. Dieselben Anlässe wie oben im Katalog – nur laufend beobachtet statt einmal recherchiert."

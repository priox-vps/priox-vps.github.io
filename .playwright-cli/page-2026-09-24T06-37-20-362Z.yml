    - generic [ref=e92]:
      - generic [ref=e93]:
        - paragraph [ref=e94]: Passt das zu Ihnen?
        - heading "Drei Sätze, die wir im Erstgespräch fast immer hören." [level=2] [ref=e95]
        - paragraph [ref=e96]: Erkennen Sie sich wieder, sind Sie hier richtig. Darunter steht jeweils, was wir dann von Ihrem Tisch nehmen.
      - generic [ref=e97]:
        - generic [ref=e98]:
          - generic [ref=e99]: "1"
          - heading "„Unsere Verkäufer telefonieren ungern – und dann kaum.“" [level=3] [ref=e100]
          - paragraph [ref=e101]: Wir übernehmen die Erstansprache komplett. Ihre Leute bekommen nur noch Termine mit Menschen, die schon wissen, worum es geht.
        - generic [ref=e102]:
          - generic [ref=e103]: "2"
          - heading "„Wir kommen nie am Vorzimmer vorbei.“" [level=3] [ref=e104]
          - paragraph [ref=e105]: "Unsere intelligente signal-basierte Ansprache macht aus dem kalten Call einen warmen: In der Regel wissen wir vor dem Anruf, wer zuständig ist und was diese Person gerade beschäftigt – oft samt Durchwahl und Mailadresse. Dann steht die Zentrale gar nicht erst dazwischen. Und wenn doch, fragen wir mit Namen und einem Grund, den sie sofort versteht."
        - generic [ref=e106]:
          - generic [ref=e107]: "3"
          - heading "„Beim letzten Dienstleister kamen Termine, aber keine Kunden.“" [level=3] [ref=e108]
          - paragraph [ref=e109]: Wir legen vorher schriftlich fest, wann ein Termin zählt – Zuständigkeit, Bedarf, Zeitpunkt. Was das nicht erfüllt, buchen wir nicht.
      - paragraph [ref=e110]:
        - text: Passt das nicht, sagen wir das im Erstgespräch. Wenn Ihr Angebot noch unklar positioniert ist, holt auch der beste Anruf nichts heraus – dann ist
        - link "Beratung" [ref=e111] [cursor=pointer]:
          - /url: /vertriebsberatung/
        - text: der erste Schritt, nicht mehr Anrufvolumen. Brauchen Sie Recherche, Ansprache und Terminierung in einem breiteren Rahmen, passt die
        - link "Neukundenakquise-Agentur" [ref=e112] [cursor=pointer]:
          - /url: /neukundenakquise-agentur/
        - text: besser.
    - generic [ref=e114]:
      - generic [ref=e115]:
        - heading "Der Ablauf bei uns in fünf Schritten" [level=2] [ref=e116]
        - paragraph [ref=e117]: Wir telefonieren nicht am ersten Tag. Die erste Woche geht für Zielkundenliste, Anlässe und Argumentation drauf – und entscheidet, ob die Gespräche danach etwas taugen.
      - generic [ref=e118]:
        - generic [ref=e119]:
          - generic [ref=e120]: "1"
          - heading "Zielbild klären" [level=3] [ref=e121]
          - paragraph [ref=e122]: Wir klären Angebot, Ausschlusskriterien, relevante Rollen und den Nutzen, den ein Gespräch konkret haben muss.
        - generic [ref=e123]:
          - generic [ref=e124]: "2"
          - heading "Anlässe definieren" [level=3] [ref=e125]
          - paragraph [ref=e126]: Wir übersetzen Ihr Zielbild in öffentliche Ereignisse und ergänzen die Wunsch-Signale Ihres Markts.
        - generic [ref=e127]:
          - generic [ref=e128]: "3"
          - heading "Unternehmen recherchieren" [level=3] [ref=e129]
          - paragraph [ref=e130]: Erst dann prüfen wir Unternehmen, Ansprechpartner und den aktuellen Anlass – aus Millionen von Quellen mit relevanten Daten.
        - generic [ref=e131]:
          - generic [ref=e132]: "4"
          - heading "Erstgespräche führen" [level=3] [ref=e133]
          - paragraph [ref=e134]: Erfahrene B2B-Vertriebsleute sprechen den Anlass an, prüfen Bedarf und vereinbaren nur passende nächste Schritte.
        - generic [ref=e135]:
          - generic [ref=e136]: "5"
          - heading "Qualität nachschärfen" [level=3] [ref=e137]
          - paragraph [ref=e138]: Einwände, Gesprächsnotizen und Rückmeldungen aus Ihrem Vertrieb verändern Recherche und Ansprache laufend.
      - paragraph [ref=e139]:
        - text: Wenn Sie die komplette Recherche und Ansprache nicht selbst aufbauen wollen, erläutert
        - link "Vertriebsoutsourcing" [ref=e140] [cursor=pointer]:
          - /url: /vertriebsoutsourcing/
        - text: die möglichen Aufgabenanteile. Wenn Ihr internes Team nur bei der Gesprächsführung Unterstützung braucht, ist ein
        - link "B2B-Vertriebstraining" [ref=e141] [cursor=pointer]:
          - /url: /vertriebstraining-b2b/
        - text: oft der sinnvollere Schritt.
      - paragraph [ref=e143]:
        - strong [ref=e144]: Was Sie pro Termin bekommen.
        - text: Firma und Ansprechpartner mit Funktion und Durchwahl. Den Anlass, mit Quelle und Datum. Was im Gespräch gesagt wurde, wörtlich an den entscheidenden Stellen. Die offenen Fragen, die Ihr Verkäufer klären muss. Und den Termin im Kalender, bestätigt von beiden Seiten.
    - generic [ref=e146]:
      - generic [ref=e147]:
        - heading "Was Ihre Wunschkunden von uns zu hören bekommen" [level=2] [ref=e148]
        - paragraph [ref=e149]: Das hier hört Ihr Wunschkunde, wenn wir anrufen. Kein erfundener „wir kennen uns doch“-Einstieg, sondern der öffentliche Anlass, ein klarer Bezug und Raum für ein Nein. Im ersten Satz wird nichts verkauft – er soll nur die nächste Frage verdienen.
      - generic [ref=e150]:
        - generic [ref=e151]:
          - heading "Ohne Anlass" [level=3] [ref=e152]
          - paragraph [ref=e153]: „Wir helfen Unternehmen wie Ihrem bei der Neukundengewinnung.“ Das kann stimmen, beantwortet aber keine Frage nach dem Zeitpunkt.
        - generic [ref=e154]:
          - heading "Mit Anlass" [level=3] [ref=e155]
          - paragraph [ref=e156]: „Sie haben letzte Woche zwei Stellen für den Vertrieb in Wien ausgeschrieben. Darf ich kurz fragen, ob externe Terminierung in diesem Aufbau eine Rolle spielt?“
      - heading "Fünf mögliche Opener" [level=3] [ref=e157]
      - list [ref=e158]:
        - listitem [ref=e159]: "„Zu Ihrer Standorteröffnung in Graz habe ich eine kurze Frage: Wer verantwortet dort den Aufbau neuer B2B-Kundenkontakte?“"
        - listitem [ref=e160]: „Sie haben die neue Produktlinie für das dritte Quartal angekündigt. Ist die Ansprache der passenden Zielkunden bereits abgedeckt?“
        - listitem [ref=e161]: „Ihre neue Vertriebsleitung wurde diese Woche vorgestellt. Darf ich fragen, ob das Team externe Unterstützung bei der Terminierung prüft?“
        - listitem [ref=e162]: „Sie stellen auf der Messe nächste Woche aus. Wollen Sie die Gespräche danach mit zusätzlicher Akquise-Kapazität nachfassen?“
        - listitem [ref=e163]: „Die ausgeschriebene öffentliche Vergabe endet am Freitag. Ist für die Umsetzung bereits ein Ansprechpartner für den Vertrieb vorgesehen?“
      - figure "Vier Minuten reichen häufig, um die Relevanz zu prüfen. Erst dann ist ein Termin sinnvoll." [ref=e164]:
        - img "Zeitachse für den Aufbau eines vierminütigen Erstgesprächs" [ref=e166]:
          - generic [ref=e167]:
            - generic [ref=e168]:
              - generic [ref=e170]: 0:00
              - generic [ref=e171]: Anlass
            - generic [ref=e172]:
              - generic [ref=e174]: 0:30
              - generic [ref=e175]: Erlaubnis
            - generic [ref=e176]:
              - generic [ref=e178]: 1:30
              - generic [ref=e179]: Fragen
            - generic [ref=e180]:
              - generic [ref=e182]: 4:00
              - generic [ref=e183]: Nächster Schritt
            - generic [ref=e184]: "Kein Monolog: Anlass nennen, Relevanz prüfen, Einwand verstehen, nächsten Schritt vereinbaren."
    - generic [ref=e187]:
      - generic [ref=e188]:
        - paragraph [ref=e189]: Wenn Widerspruch kommt
        - heading "Der erste Widerspruch ist selten ein Nein" [level=2] [ref=e190]
      - paragraph [ref=e191]: "„Kein Interesse“ hören wir wie jeder andere auch. Der Unterschied liegt darin, was in den zehn Sekunden danach passiert. Wir trennen zuerst den Vorwand vom Einwand: Der Vorwand ist ein Reflex, um das Gespräch zu beenden, der Einwand ein Grund, der die Person tatsächlich beschäftigt. Beim Vorwand nehmen wir den Druck heraus, beim Einwand gehen wir hinein."
      - generic [ref=e192]:
        - generic [ref=e193]:
          - heading "Benennen" [level=3] [ref=e194]
          - paragraph [ref=e195]: „Klingt, als käme der Anruf gerade ungelegen.“ Wer den Widerstand ausspricht, statt ihn zu überspielen, bekommt fast immer eine echte Antwort – und oft einen besseren Termin.
        - generic [ref=e196]:
          - heading "Sortieren" [level=3] [ref=e197]
          - paragraph [ref=e198]: Nein zum Zeitpunkt, Nein zum Thema oder Nein zur Zuständigkeit? Das sind drei verschiedene Gespräche. Nur eines davon ist wirklich zu Ende.
        - generic [ref=e199]:
          - heading "Die Konsequenzfrage" [level=3] [ref=e200]
          - paragraph [ref=e201]: „Und wenn sich daran im nächsten halben Jahr nichts ändert – womit rechnen Sie dann?“ Die Frage bewertet nichts. Sie lässt den Angerufenen selbst zu Ende denken.
      - paragraph [ref=e202]: Jeden Einwand, der öfter als einmal auftaucht, schreiben wir mit und geben ihn Ihnen weiter. Wenn zehn Entscheider dieselbe Rückfrage stellen, ist das keine Gesprächspanne, sondern eine Information über Ihr Angebot – und meistens die wertvollste, die aus einer Akquisewoche herauskommt.
    - generic [ref=e204]:
      - generic [ref=e205]:
        - heading "Wann wir anrufen" [level=2] [ref=e206]
        - paragraph [ref=e207]:
          - text: "Ob ein Anruf abgewürgt wird oder in ein Gespräch führt, liegt nicht immer am Verkäufer. Es liegt am Zeitpunkt. Deshalb suchen wir vor jeder Ansprache erst den Anlass: eine Stellenausschreibung, einen Führungswechsel, einen neuen Standort, eine Finanzierung. Nachlesen kann das nicht jeder – die Daten liegen über Millionen von Quellen verstreut. Unser"
          - link "Central-Sales-Intelligence-System" [ref=e208] [cursor=pointer]:
            - /url: https://priox.ai/
          - text: wertet sie laufend aus und meldet uns den Moment, in dem Ihr Thema bei dem Angerufenen ohnehin gerade auf dem Tisch liegt.
        - paragraph [ref=e209]: "Für Sie hat das noch einen zweiten Nutzen: Ihre Zielkundenliste ist endlich. Wer gerade keinen Grund hat, bleibt auf Beobachtung, statt mit einem beliebigen Pitch verbrannt zu werden."
        - paragraph [ref=e210]: "Der zweite Zeitpunkt ist der im Tagesablauf. Wir wählen nicht nach Liste, sondern in die Lücken zwischen den Terminen: früh vor dem ersten Meeting, in der Mittagslücke, am späten Nachmittag. Wer gerade nicht im Termin sitzt, geht ans Telefon und spricht auch. Ein Anruf am Dienstag um elf trifft fast immer eine besetzte Stunde – deshalb rufen wir dann nicht an."
      - generic [ref=e211]:
        - generic [ref=e212]:
          - heading "Mehr als 40 Anlässe – und wenn es 100 sein müssen, sind es 100" [level=3] [ref=e213]
          - paragraph [ref=e214]: Wie viele es in Ihrem Projekt werden, entscheidet Ihr Markt, nicht unser Katalog. Welche Ereignisse das sind, was dahintersteckt und wie lange das Zeitfenster jeweils offen steht, haben wir aufgeschrieben – samt der Wunsch-Signale, die wir für Sie ergänzen.
          - paragraph [ref=e215]:
            - link "Zum Signalkatalog →" [ref=e216] [cursor=pointer]:
              - /url: /signal-based-selling/
        - generic [ref=e217]:
          - heading "Warum der erste Satz sitzt" [level=3] [ref=e218]
          - paragraph [ref=e219]: In den ersten Satz gehört genau ein Ereignis – das, welches den Angerufenen gerade selbst beschäftigt. Kein Pitch, keine Aufzählung, kein Hinweis darauf, was wir sonst noch wissen. Deshalb hört man uns zu.
      - paragraph [ref=e221]:
        - text: "Viele Teams besitzen bereits ein CRM-Scoring in HubSpot oder einer Tabelle. Dieses System bleibt bestehen. Wir schärfen es nach: Der Fit zeigt, ob ein Unternehmen grundsätzlich passt; der Anlass zeigt, ob gerade etwas passiert. Öffentliche Live-Signale ergänzen Stammdaten, Ereignisse altern in eigenen Zeitfenstern, und die Spitze wird von Hand auf Entscheider und Zusammenhang geprüft. So wird aus einem Punktwert ein tragfähiger erster Satz, auch für Unternehmen, die noch nicht in Ihrer Datenbank stehen. Mehr zur Methode finden Sie bei"
        - link "PrioX Lead-Scoring" [ref=e222] [cursor=pointer]:
          - /url: https://priox.ai/lead-scoring
        - text: ", unserer eigenen Software für diese Suche."
    - generic [ref=e224]:
      - generic [ref=e225]:
        - 'heading "Qualitätskriterien: woran Sie eine seriöse Kaltakquise-Agentur erkennen" [level=2] [ref=e226]'
        - paragraph [ref=e227]: Sie geben einem Fremden Zugang zu Ihren Wunschkunden. Prüfen Sie uns an diesen Punkten – und jeden anderen Anbieter genauso.
      - generic [ref=e228]:
        - generic [ref=e229]:
          - heading "Acht Qualitätskriterien" [level=3] [ref=e230]
          - list [ref=e231]:
            - listitem [ref=e232]: Ein klares Zielkundenbild und Ausschlusskriterien.
            - listitem [ref=e233]: Öffentlich belegte, konkrete Anlässe statt Listenmenge.
            - listitem [ref=e234]: Seniorige B2B-Vertriebserfahrung am Telefon.
            - listitem [ref=e235]: Transparente Rollen und keine Täuschung.
            - listitem [ref=e236]: Dokumentierte Gesprächsgründe und Einwände.
            - listitem [ref=e237]: Definierte Kriterien für qualifizierte Termine.
            - listitem [ref=e238]: Rückkopplung mit Ihrem Vertrieb.
            - listitem [ref=e239]: Datenschutz und Rechtsprüfung als Prozess, nicht als Fußnote.
        - generic [ref=e240]:

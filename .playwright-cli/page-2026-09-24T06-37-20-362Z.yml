    - generic [ref=e271]:
      - generic [ref=e272]:
        - paragraph [ref=e273]: Der Unterschied in Zahlen
        - 'heading "Standardagentur und DEALMAKERS: gleiche Liste, andere Zahlen" [level=2] [ref=e274]'
      - paragraph [ref=e275]: "Wer eine Liste von oben nach unten abtelefoniert, landet bei den bekannten Branchenwerten: Von 100 Wählversuchen führen 10 bis 20 zu einem Gespräch mit der zuständigen Person, daraus werden ein bis drei Termine. Das ist der ehrliche Durchschnitt der Kaltakquise – und der Grund, warum sie als reines Zahlenspiel gilt."
      - paragraph [ref=e276]: Wir drehen drei Stellschrauben, bevor die erste Nummer gewählt wird. Wir kennen die zuständige Person namentlich und haben meist Durchwahl oder Mobilnummer, also keine Zentrale dazwischen. Wir wählen in ein Fenster, in dem sie wirklich am Platz ist. Und wir haben einen Anlass, der das Gespräch von allein trägt. Wo alle drei zusammenkommen, erreichen wir teilweise 60 Prozent der Angerufenen – und aus 40 Prozent dieser Gespräche wird ein Termin.
      - 'figure "Nicht mehr wählen, sondern anders wählen: Derselbe Aufwand am selben Tag ergibt ein anderes Ergebnis, wenn Nummer, Zeitpunkt und Anlass vorher stimmen." [ref=e277]':

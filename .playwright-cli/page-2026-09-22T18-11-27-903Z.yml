      - paragraph [ref=e327]: "Aus der M&A-Arbeit bei S&B Strategy in Buy-and-Build und Commercial Due Diligence folgt ein zusätzlicher Maßstab: Eine Pipeline ist erst dann wertvoll, wenn sie einer Prüfung standhält. Sie muss wiederkehrend sein, dokumentiert und nicht an einer Person hängen. Für Inhaber mit Verkaufsabsicht in drei bis fünf Jahren ist das keine Vertriebsromantik, sondern Substanz."
      - paragraph [ref=e328]:
        - text: Genau deshalb dokumentieren wir Zielkundenkreis, Gesprächsgründe und Nachfassprozess. Auch bei

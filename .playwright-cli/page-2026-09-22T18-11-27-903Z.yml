        - strong [ref=e195]: "Was diese Zahlen für Sie bedeuten – und was nicht:"
        - text: "Es sind persönliche Zielerreichungswerte aus angestellten Vertriebsrollen, kein Versprechen, dass Ihr Umsatz um 200 % steigt. Ihr Nutzen liegt darin, wo diese Zahlen entstanden sind: unter echtem Quotendruck, mit echten Absagen, im selben Marktsegment. Die Gesprächsführung, die später in Ihrem Playbook steht, ist dort entstanden und nicht im Seminarraum. Wer seine eigene Zahl fast 20 Jahre lang liefern musste, baut andere Playbooks als jemand, der Vertrieb nur unterrichtet hat. Was wir Ihnen versprechen, sind nicht Prozentzahlen, sondern nachvollziehbare Aktivität, saubere Gespräche und Termine mit Entscheidern."

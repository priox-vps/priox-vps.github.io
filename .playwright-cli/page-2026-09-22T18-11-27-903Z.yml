    - generic [ref=e284]:
      - heading "Gesprächsführung mit Nachweis" [level=2] [ref=e285]
      - paragraph [ref=e286]: "Die ersten 20 Sekunden eines Anrufs entscheiden nicht alles, aber sie entscheiden, ob ein Gespräch beginnen darf. Ein konkreter Anlass öffnet die Tür. Danach geht es um Sprachmuster, die Widerstand nicht erst erzeugen: eine Frage statt einer Behauptung, eine Pause statt eines Nachschiebens, eine Klärung statt eines Gegenarguments. Zuhören auf Stimmlage und Zögern, Einwände als Information behandeln und ohne Rabattreflex verhandeln – das ist lernbar und trainierbar."
      - paragraph [ref=e287]: "Die Grundlagen sind belegt: NLP-Master (DVNLP), systemische und hypnosystemische Gesprächsführung, Mimikresonanz und Emotionserkennung (Eilert Akademie), Sozialpsychologie (University of Queensland), das Verhandlungssystem des NASHER Negotiation Institute sowie Trainings bei Tim Taxis und Umberto Saxer. Entscheidend ist nicht die Liste der Ausbildungen, sondern ihre Übersetzung in ein Gespräch, das die andere Seite ernst nimmt."
      - paragraph [ref=e289]:
        - strong [ref=e290]: "Was wir ausdrücklich nicht tun:"
        - text: Wir bringen niemanden zu einer Entscheidung, die ihm nicht nützt. Psychologie sorgt dafür, dass ein gutes Angebot verstanden wird, nicht dafür, dass ein schlechtes durchgeht.
      - paragraph [ref=e291]:
        - text: Für ein Team, das neben externer Kapazität eigenes Können aufbauen will, verbinden wir diese Arbeit auch mit
        - link "B2B-Vertriebstraining" [ref=e292] [cursor=pointer]:
          - /url: /vertriebstraining-b2b/
        - text: . Beim
        - link "externen Vertrieb" [ref=e293] [cursor=pointer]:
          - /url: /externer-vertrieb/
        - text: "bleibt dieselbe Regel gültig: Die Argumentation muss zum Angebot passen, nicht zum Wunsch nach einer schnellen Zusage."
    - generic [ref=e295]:
      - heading "Die Methode steht geschrieben" [level=2] [ref=e296]
      - generic [ref=e297]:
        - figure [ref=e298]:
          - img "Das Methodenhandbuch The Magic of Sales – Emotional Resonance von Florian Weippert" [ref=e300]
        - generic [ref=e301]:
          - paragraph [ref=e302]:
            - text: "Gesprächsführung kann jeder behaupten. Wir können sie nachschlagen. 383 Seiten, entstanden 2021 und im November 2022 zuletzt überarbeitet:"
            - emphasis [ref=e303]: The Magic of Sales – Emotional Resonance
            - text: ist das Handbuch, aus dem unsere Gespräche kommen – vom ersten Satz über die Bedarfsfrage und den Umgang mit Einwänden bis zur Verhandlung.
          - paragraph [ref=e304]:
            - text: "Das Buch war nie im Handel. Es ist kein Verlagsprojekt, sondern der Versuch, knapp zwanzig Jahre Vertriebspraxis so zu ordnen, dass man sie weitergeben kann: an die Menschen, die bei uns telefonieren, und an die Teams, die wir trainieren. Deshalb steht darin auch ausführlich, was"
            - emphasis [ref=e305]: nicht
            - text: funktioniert.
          - paragraph [ref=e306]: Florian Weippert · 383 Seiten · Fassung November 2022
      - paragraph [ref=e308]:
        - strong [ref=e309]: "Was das für Sie bedeutet:"
        - text: Wenn Sie fragen, warum ein Anruf so und nicht anders geführt wurde, bekommen Sie von uns eine Begründung statt einer Meinung. Und wenn wir Ihr Team
        - link "trainieren" [ref=e310] [cursor=pointer]:
          - /url: /vertriebstraining-b2b/
        - text: ", trainieren wir aus einem geordneten System, nicht aus einer Foliensammlung."
    - generic [ref=e312]:
      - heading "Was Sie behalten, wenn wir gehen" [level=2] [ref=e313]
      - paragraph [ref=e314]: Die Leistung soll nicht mit dem letzten Anruf verschwinden. Sie behalten ein Sales Playbook, einen definierten Zielkundenkreis, eine Einwandbibliothek, einen aufgeräumten Nachfassprozess und ein geschultes eigenes Team. Florian Weippert war bei PayPal Mitgründer der Inside-Sales-Academy mit 25+ ausgebildeten Vertrieblern und 300+ persönlichen Coachings.
      - paragraph [ref=e315]:
        - text: Das unterscheidet die Arbeit von einer Lead-Fabrik, bei der nach Vertragsende nur ein Export und die Erinnerung an geführte Gespräche übrig bleiben. Wenn Sie eher eine Strukturfrage als zusätzliche Kapazität haben, ist
        - link "Vertriebsberatung" [ref=e316] [cursor=pointer]:
          - /url: /vertriebsberatung/
        - text: oft der passendere Anfang als ein ausgelagertes Projekt.

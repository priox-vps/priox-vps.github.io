      - paragraph [ref=e333]: Wir passen nicht zu reinem Endkundengeschäft. Wir passen auch nicht, wenn Abschlüsse in Woche zwei erwartet werden, obwohl Angebot, Zielkunden und Gesprächsweg erst geklärt werden müssen. Ein Produkt ohne klaren Nutzen lässt sich nicht durch bessere Formulierungen retten. Und wer vor allem den billigsten Anbieter sucht, findet bei uns nicht das passende Modell.
      - paragraph [ref=e334]:

      - paragraph [ref=e259]: "Beispiele, keine abschließende Liste. Zusätzlich definieren wir Wunsch-Signale, wenn sie im Markt eines Kunden eine besondere Bedeutung haben: etwa ein auslaufender Rahmenvertrag, eine verlorene Zertifizierung, eine Normänderung oder der Wegfall einer Förderung."

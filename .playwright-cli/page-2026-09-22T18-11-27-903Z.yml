    - generic [ref=e213]:
      - heading "Einarbeitung in Tagen, nicht Monaten" [level=2] [ref=e214]
      - paragraph [ref=e215]: "SaaS, Fintech, Telematik, Bau und Infrastruktur, Unternehmensberatung und Personal: Die Branchenbreite ersetzt keine Vorbereitung, sie verkürzt den Weg zu den richtigen Fragen. Zuerst wird der Zielkundenkreis eingegrenzt. Danach zerlegen wir Angebot und Nutzen in Formulierungen, die ein Entscheider ohne Fachvortrag versteht. Anschließend sammeln wir typische Einwände, prüfen öffentlich sichtbare Anlässe und legen fest, wann ein Gespräch nicht passt."
      - paragraph [ref=e216]:
        - text: Ein öffentlich sichtbares Signal ist dabei nur ein konkreter Anlass, etwa eine ausgeschriebene Stelle, ein neuer Standort oder eine Produktankündigung –
        - strong [ref=e217]: Beispiele, nicht als abschließende Liste.
        - text: „Sie haben letzte Woche zwei Stellen in Wien ausgeschrieben. Wie organisieren Sie die Ansprache für den neuen Markt?“ ist ein möglicher Einstieg. „Ihre neue Produktlinie ist öffentlich angekündigt. Wer verantwortet, dass die ersten Gespräche dazu entstehen?“ ist ein zweiter.
      - paragraph [ref=e218]: Die genannten Ereignisse kommen ausschließlich aus öffentlich zugänglichen Quellen. Wir nennen im Gespräch nur den konkreten Anlass, nie ein länger beobachtetes Muster. So bleibt der Einstieg nachvollziehbar und wirkt nicht wie Überwachung.

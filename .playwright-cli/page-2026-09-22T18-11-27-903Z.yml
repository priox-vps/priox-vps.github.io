            - generic [ref=e88]: DEALMAKERS verantwortet die rechte Hälfte.
    - generic [ref=e91]:
      - heading "Wer hier tatsächlich arbeitet" [level=2] [ref=e92]
      - paragraph [ref=e93]: "Florian Weippert arbeitet sich in jedes Projekt persönlich ein: Zielkunden, Angebot, Einwände und Playbook. Danach übergibt er an ein Team, das je Projekt aus erfahrenen Freelancern zusammengestellt wird. Bei einfachen Fällen geht es direkt an dieses Team. Die Teamgröße liegt je Projekt bei 5 bis 10 Personen."
      - paragraph [ref=e94]:
        - strong [ref=e95]: "Was das für Sie heißt:"
        - text: Kein Werkstudent sitzt am Hörer, kein wechselndes Karussell arbeitet eine Liste ab. Gleichzeitig telefoniert der Gründer nicht dauerhaft selbst. Das wäre für eine skalierbare Vertriebsleistung die falsche Zusage. Seine Rolle ist, das Projekt so vorzubereiten und zu führen, dass die Gesprächsqualität nicht an einer einzigen Person hängt.
      - paragraph [ref=e96]:
        - text: Alle Anrufer bringen jahrelange eigene B2B-Vertriebserfahrung mit. Sie lesen kein Skript vor, sondern führen ein inhaltliches Gespräch. Das ist gerade bei einer
        - link "Telefonakquise-Agentur" [ref=e97] [cursor=pointer]:
          - /url: /telefonakquise-agentur/
        - text: "kein Detail: Nach dem zweiten Einwand beginnt erst die Arbeit, die ein einfaches Callcenter nicht abdeckt."

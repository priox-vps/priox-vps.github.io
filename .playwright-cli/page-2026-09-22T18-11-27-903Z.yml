    - generic [ref=e71]:
      - heading "Warum diese Seite" [level=2] [ref=e72]
      - paragraph [ref=e73]:
        - text: Nach der Beschreibung von
        - link "unseren Leistungen" [ref=e74] [cursor=pointer]:
          - /url: /leistungen/
        - text: "bleibt eine vernünftige Frage: Wer macht die Arbeit eigentlich? Timing aus Daten haben inzwischen viele. Der öffentlich sichtbare Anlass kann den ersten Satz begründen, aber er führt kein Gespräch, hört keinen Einwand und entscheidet nicht, wann eine Nachfrage sinnvoll ist. Diese zweite Hälfte gehört auf den Prüfstand. Für ein Erstgespräch stehen die direkten Wege unter"
        - link "Kontakt" [ref=e75] [cursor=pointer]:
          - /url: /kontakt/
        - text: .
      - figure "Ein Anlass erzeugt Aufmerksamkeit. Ob daraus ein belastbares Gespräch wird, entscheidet die Gesprächsführung." [ref=e76]:
        - 'img "Zwei Hälften: Signal bestimmt wann, Gesprächsführung bestimmt wie; die Gesprächsführung ist hervorgehoben" [ref=e78]':
          - generic [ref=e79]:
            - generic [ref=e82]: WANN
            - generic [ref=e83]: Signal
            - generic [ref=e84]: Anlass zum Anrufen

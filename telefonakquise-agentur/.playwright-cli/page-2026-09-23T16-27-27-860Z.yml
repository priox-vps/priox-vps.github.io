            - cell "1–6 Monate" [ref=e240]
          - row [ref=e241]:
            - cell "Rahmenvertrag öffentlich ausgeschrieben" [ref=e242]
            - cell "Konkreter Bedarf mit Frist" [ref=e243]
            - cell "bis zur Frist" [ref=e244]
      - paragraph [ref=e245]:
        - strong [ref=e246]: Das ist ein Beispiel-Set, keine Liste, die wir abarbeiten.
        - text: "Welche Anlässe für Sie zählen, legen wir vor dem Start gemeinsam fest – Ihre Konfiguration sieht mit hoher Wahrscheinlichkeit völlig anders aus als diese Tabelle. Der Grundsatz dahinter ist einfach: Was irgendwo öffentlich sichtbar ist, lässt sich als Anlass nutzen. Stellenanzeige, Pressemitteilung, Handelsregister, Messeauftritt, Podcast, Beitrag auf einem Karrierenetzwerk, geänderte Preisseite, neue Zertifizierung. Wenn Sie uns sagen, worauf Ihr Markt reagiert, nehmen wir es auf."
      - paragraph [ref=e247]: "Dazu kommen Ihre Wunsch-Signale, die nur in Ihrem Markt etwas bedeuten: ein auslaufender Rahmenvertrag, eine verlorene Zertifizierung, eine Normänderung, der Wegfall einer Förderung. Sagen Sie uns, worauf Ihr Markt reagiert – wir nehmen es auf."
    - generic [ref=e249]:
      - generic [ref=e250]:
        - paragraph [ref=e251]: Das Handwerk
        - heading "Der Gesprächsaufbau in fünf Phasen" [level=2] [ref=e252]
      - paragraph [ref=e253]:
        - strong [ref=e254]: Wir bleiben im Beispiel von oben
        - text: – der ausgeschriebenen Vertriebsstelle für den neuen Standort. Die Sätze in den folgenden Karten dienen nur der Verdeutlichung; in Ihrem Fall steht dort ein anderer Anlass, eine andere Rolle und eine andere Frage. Der Ablauf bleibt, die Inhalte werden für Ihren Markt neu geschrieben.
      - paragraph [ref=e255]: Ein gutes Erstgespräch braucht keinen Monolog, sondern einen Rahmen. Die ersten zwanzig Sekunden schaffen Erlaubnis, nicht Abschlussdruck. Erst wenn Rolle und Anlass bestätigt oder korrigiert sind, ist eine Terminfrage sinnvoll.
      - generic [ref=e256]:
        - generic [ref=e257]:
          - 'heading "1. Anlass nennen: 0:00–0:20" [level=3] [ref=e258]'
          - paragraph [ref=e259]: "Der Satz ist kurz und überprüfbar: „Sie haben die Leitung für den neuen Standort ausgeschrieben.“ Dann folgt die Frage nach Zuständigkeit. Keine versteckte Rechercheleistung, keine Bewertung des Unternehmens."
        - generic [ref=e260]:
          - 'heading "2. Erlaubnis holen: 0:20–0:40" [level=3] [ref=e261]'
          - paragraph [ref=e262]: „Habe ich Sie für zwei kurze Fragen zur Vertriebsseite erwischt?“ Das gibt dem Gesprächspartner eine Ausstiegsmöglichkeit. Wer sie nicht gibt, bekommt selten brauchbare Antworten.
        - generic [ref=e263]:
          - 'heading "3. Lage klären: 0:40–1:30" [level=3] [ref=e264]'
          - paragraph [ref=e265]: "Eine offene Frage reicht: „Wie gewinnen Sie für die neue Region aktuell Ersttermine?“ Dann zuhören. Die Pause nach der Frage ist Teil des Gesprächs, kein Fehler."
        - generic [ref=e266]:
          - 'heading "4. Einwand verstehen: 1:30–3:00" [level=3] [ref=e267]'
          - paragraph [ref=e268]: "„Kein Bedarf“ kann heißen: falscher Zeitpunkt, falsche Rolle oder echte Absage. Erfahrung zeigt sich darin, erst nachzufragen und nicht sofort den nächsten Satz des Skripts abzulesen."
        - generic [ref=e269]:
          - 'heading "5. Nächsten Schritt vereinbaren: bis 4:00" [level=3] [ref=e270]'
          - paragraph [ref=e271]: "Wenn Thema und Rolle passen, wird der Termin konkret: Teilnehmer, Dauer, Fragestellung und Zeitpunkt. Wenn nicht, wird ein späteres Fenster oder ein sauberer Abschluss notiert."
        - generic [ref=e272]:
          - heading "Stimme, Tempo, Pause" [level=3] [ref=e273]
          - paragraph [ref=e274]: Eine ruhige Stimme ersetzt keine Substanz, macht sie aber hörbar. Menschen mit Vertriebserfahrung variieren Tempo und Formulierung, statt jede Pause mit einem Argument zuzuschütten.
      - paragraph [ref=e275]:
        - text: Das ist ein anderer Auftrag als
        - link "Neukundenakquise als Gesamtleistung" [ref=e276] [cursor=pointer]:
          - /url: /neukundenakquise-agentur/
        - text: ": Hier wird besonders sichtbar, ob die Person am Hörer fachlich führen kann. Ein erfahrener Anrufer reagiert auf den zweiten Einwand mit einer Frage oder einem ehrlichen Abbruch. Ein Skript liefert oft nur den nächsten vorformulierten Satz."
      - paragraph [ref=e277]: "Wir hören auch nicht zwingend beim Termin auf. Auf Wunsch führen wir den Zyklus weiter: Angebot begleiten, nachfassen, verhandeln und innerhalb des Preisrahmens abschließen, den Sie freigeben. Für tiefe fachliche Fragen holen wir Ihre Leute dazu. Nur die Betreuung Ihrer Bestandskunden übernehmen wir nicht – das ist Account-Management und lebt von Historie und gewachsener Beziehung."
    - generic [ref=e279]:
      - generic [ref=e280]:
        - paragraph [ref=e281]: Kein Trick nötig
        - heading "Warum das Vorzimmer bei uns selten vorkommt" [level=2] [ref=e282]
      - paragraph [ref=e283]: "Die halbe Branche trainiert, wie man an der Zentrale vorbeikommt. Wir stellen die Frage davor: Warum landen wir überhaupt dort? In der Regel wissen wir, wer zuständig ist und was diese Person gerade beschäftigt, und wir haben Durchwahl oder Mobilnummer. Damit ist das Vorzimmer schlicht nicht im Spiel – es gibt nichts zu umgehen."
      - paragraph [ref=e284]: "Und wenn doch jemand dazwischensteht, entscheidet kein Trick, sondern der Anlass. „Es geht um die Vertriebsstelle für Wien, die seit Montag ausgeschrieben ist“ ist für eine Assistenz etwas völlig anderes als „Ich hätte da mal eine Frage zum Thema Vertrieb“. Ein konkreter, überprüfbarer Grund gibt ihr eine Grundlage zu entscheiden – und genau dieser Grund trägt später auch den Termin. Kein falscher Name, kein erfundener Rückruf: Wer so etwas braucht, hat keinen Anlass."
      - heading "Die Stimme entscheidet mit – in den ersten drei Sekunden" [level=3] [ref=e285]
      - paragraph [ref=e286]:
        - text: Bevor Ihr Gegenüber den ersten Satz inhaltlich bewertet hat, hat er den Anrufer längst einsortiert. Das läuft über die Tonhöhe am Satzende. Geht sie nach oben, klingt jeder Satz wie eine Bitte um Erlaubnis – der typische Klang des 0815-Verkäufers, der selbst nicht sicher ist, ob er stören darf. Wir arbeiten bewusst mit der abfallenden Stimmführung, der
        - strong [ref=e287]: Downwards Inflection
        - text: ": Der Satz endet tiefer, als er begonnen hat. Das ist der Tonfall, in dem Menschen Auskunft geben, statt um etwas zu bitten."
      - figure "„Passt Ihnen Dienstag um zehn?“ – derselbe Wortlaut, zwei völlig verschiedene Antworten. Die Tonhöhe am Satzende entscheidet, ob es nach Bitte oder nach Vorschlag klingt." [ref=e288]:
        - 'img "Zwei Tonhöhenverläufe: oben steigt die Stimme am Satzende an, unten fällt sie ab" [ref=e290]':
          - generic [ref=e291]:
            - generic [ref=e292]: DERSELBE SATZ, ZWEI TONHÖHENVERLÄUFE
            - generic [ref=e293]: "0815-Verkäufer: Stimme steigt am Satzende"
            - generic [ref=e295]: wirkt wie eine Bitte um Erlaubnis – leicht abzulehnen
            - generic [ref=e296]: "Downwards Inflection: Stimme fällt am Satzende"
            - generic [ref=e298]: wirkt wie ein Vorschlag unter Berufstätigen – wird eher angenommen
      - paragraph [ref=e300]: "Chris Voss, jahrelang Verhandlungsführer des FBI, nennt die ruhige, warme, nach unten geführte Variante die „Late-Night-FM-DJ-Stimme“: langsam, warm, fallend. Sie nimmt Tempo aus dem Gespräch, statt es hochzudrehen – und ein ruhiges Gegenüber ist die Voraussetzung dafür, dass überhaupt zugehört wird. Drei Stellen machen dabei den Unterschied: die eigene Namensnennung, der Anlasssatz und die Terminfrage. Besonders die Terminfrage. Das lässt sich nicht als Skript ausgeben, das muss jemand können – und es ist einer der Gründe, warum bei uns keine Aushilfe am Hörer sitzt."
    - generic [ref=e302]:
      - generic [ref=e303]:
        - paragraph [ref=e304]: Der Hebel vor dem Anruf
        - heading "Wir rufen an, wenn jemand wirklich am Platz ist" [level=2] [ref=e305]
      - paragraph [ref=e306]: Der häufigste Grund, warum ein Anruf scheitert, ist nicht der Mensch am anderen Ende, sondern der Zeitpunkt. Wer eine Liste von oben nach unten durchwählt, trifft einen großen Teil seiner Zielgruppe mitten im Termin. Deshalb raten wir nicht, wann jemand frei ist – wir prüfen es. Wir setzen Werkzeuge ein, die Kalenderverfügbarkeiten auch fremder Kalender auslesen, und legen den Anruf gezielt in ein offenes Fenster.
      - figure "Ein Anruf im freien Fenster erreicht jemanden am Schreibtisch, kein Freizeichen und keine Mailbox." [ref=e307]:
        - img "Tagesleiste eines Entscheiders mit belegten Terminblöcken und einem freien Fenster, in das der Anruf gelegt wird" [ref=e309]:
          - generic [ref=e310]:
            - generic [ref=e311]: KALENDER DES ENTSCHEIDERS, DIENSTAG
            - generic [ref=e317]:
              - generic [ref=e318]: 9:00
              - generic [ref=e319]: 10:30
              - generic [ref=e320]: 11:15
              - generic [ref=e321]: 14:00
              - generic [ref=e322]: 15:00
            - generic [ref=e323]:
              - generic [ref=e324]: belegt
              - generic [ref=e325]: belegt
              - generic [ref=e326]: belegt
            - generic [ref=e328]: "Anruf: 10:40"
            - generic [ref=e329]: Freie Fenster sind golden umrandet. Dort klingelt das Telefon, nicht davor und nicht mitten im Meeting.
            - generic [ref=e330]: Beispieltag zur Verdeutlichung – Ihre Zielgruppe hat andere Rhythmen.
      - paragraph [ref=e332]: "Zusammen mit der Durchwahl oder Mobilnummer ist das der eigentliche Hebel hinter unserer Call-to-Connect-Rate: Wer gerade nicht in einem Meeting sitzt und dessen Telefon direkt klingelt, geht in aller Regel ran. Ob aus dem Gespräch ein Termin wird, entscheidet danach der Anlass – aber zuerst muss überhaupt jemand abnehmen. Was das in Zahlen bedeutet, steht im nächsten Abschnitt."
    - generic [ref=e334]:
      - generic [ref=e335]:
        - paragraph [ref=e336]: Das Handwerk dahinter
        - heading "Einwandbehandlung, die nicht nach Einwandbehandlung klingt" [level=2] [ref=e337]
      - paragraph [ref=e338]: "Was Sie kennen: Der Anrufer hört „kein Bedarf“ und legt eine auswendig gelernte Gegenrede nach. Das ist die Standardschule – und sie scheitert genau daran, dass Ihr Gegenüber sie nach zwei Sekunden erkennt. Bei uns ist ein Einwand keine Aussage, die widerlegt werden muss, sondern die einzige echte Information, die wir in diesem Moment bekommen. Drei Sätze tragen unsere Gesprächsführung:"
      - generic [ref=e339]:
        - generic [ref=e340]:
          - heading "Erst beruhigen, dann reden" [level=3] [ref=e341]
          - paragraph [ref=e342]: Solange jemand im Abwehrmodus ist, hört er keine Argumente – er sucht den Ausgang. Die erste Aufgabe am Telefon ist nicht Überzeugung, sondern ein ruhiges Gegenüber. Alles andere kommt danach oder gar nicht.
        - generic [ref=e343]:
          - heading "Druck kommt nie von uns" [level=3] [ref=e344]
          - paragraph [ref=e345]: Wir erzeugen keine Dringlichkeit, wir machen die vorhandene sichtbar. Der Grund zu handeln liegt in seiner Lage, nicht in unserem Angebot. Wer das begriffen hat, muss nie drücken – und wird deshalb auch nie abgewimmelt.
        - generic [ref=e346]:
          - heading "Sympathie ist Vorbedingung" [level=3] [ref=e347]
          - paragraph [ref=e348]: Niemand kauft von jemandem, den er als Gegner erlebt. Deshalb widersprechen wir am Telefon praktisch nie. Zustimmen und trotzdem weiterkommen ist eine Technik, kein Charakterzug.
      - paragraph [ref=e349]: "Konkret heißt das im Gespräch:"
      - table [ref=e351]:
        - rowgroup [ref=e352]:
          - row [ref=e353]:
            - columnheader "Situation" [ref=e354]
            - columnheader "Was die meisten tun" [ref=e355]
            - columnheader "Was wir stattdessen tun" [ref=e356]
        - rowgroup [ref=e357]:
          - row [ref=e358]:
            - cell "Noch bevor ein Einwand kommt" [ref=e359]
            - cell "direkt in den Pitch" [ref=e360]
            - 'cell "Wir sprechen den schlimmsten Gedanken selbst aus: „Sie bekommen vermutlich drei solcher Anrufe am Tag, und die meisten sind Zeitverschwendung.“ Ein Vorwurf, den man selbst ausspricht, kann nicht mehr gegen einen verwendet werden." [ref=e361]'
          - row [ref=e362]:
            - cell "„Kein Interesse.“" [ref=e363]
            - cell "noch ein Nutzenargument nachlegen" [ref=e364]
            - 'cell "Wir fragen nach vorn statt nach dem Warum: „Was müsste sich konkret verbessern, damit ein Gespräch sich für Sie lohnt?“ Ein „Warum“ erzeugt Rechtfertigung, eine Zukunftsfrage erzeugt Kriterien." [ref=e365]'
          - row [ref=e366]:
            - cell "„Wir haben schon einen Dienstleister.“" [ref=e367]
            - cell "den Wettbewerber schlechtreden" [ref=e368]
            - 'cell "Wir trennen zuerst Vorwand von Einwand: „Angenommen, das wäre gelöst – wäre es dann ein Thema für Sie?“ Nur ein echter Einwand ist verhandelbar, ein Vorwand kostet nur Zeit." [ref=e369]'
          - row [ref=e370]:
            - cell "„Wir verlieren zu viel Zeit in der Abstimmung.“" [ref=e371]
            - cell "sofort eine Lösung anbieten" [ref=e372]
            - 'cell "Wir spiegeln die letzten Worte und schweigen: „Zeit in der Abstimmung?“ – dann Pause. Was Ihr Gegenüber in diese Stille hineinsagt, ist mehr wert als jedes Argument, das wir hätten vorbringen können." [ref=e373]'
          - row [ref=e374]:
            - cell "„Schicken Sie mir eine E-Mail.“" [ref=e375]
            - cell "ein PDF senden und nie wieder etwas hören" [ref=e376]
            - 'cell "„Eine E-Mail – damit ich Ihnen nichts Irrelevantes schicke: Darf ich zwei kurze Fragen stellen?“ Und wenn es doch eine höfliche Abfuhr war, machen wir den Ausstieg leicht: „Wenn Sie einfach irgendetwas meinen, ist das auch ein Nein – völlig in Ordnung. Trifft das eher zu?“" [ref=e377]'
          - row [ref=e378]:
            - cell "„Jetzt gerade nicht, vielleicht nächstes Quartal.“" [ref=e379]
            - cell "„Wann darf ich denn wieder anrufen?“" [ref=e380]
            - 'cell "Wir lassen ihn die Folge selbst aussprechen: „Wenn das bis zum nächsten Quartal so bleibt – was heißt das für Ihre Zielerreichung?“ Diese eine Frage ist der Punkt, an dem sich alle ernsthaften Verkaufsschulen einig sind." [ref=e381]'
          - row [ref=e382]:
            - cell "Zustimmung, die keine ist" [ref=e383]
            - cell "schnell den Termin festzurren" [ref=e384]
            - cell "Wir fassen seine Lage so lange zusammen, bis er „genau“ sagt. Vorher ist es Höflichkeit, danach ist es Übereinstimmung – und ein Termin auf Höflichkeit platzt." [ref=e385]
          - row [ref=e386]:
            - cell "Ein Ja, das zu leicht kam" [ref=e387]
            - cell "sich freuen" [ref=e388]
            - 'cell "Wir bieten ein schützendes Nein an: „Wäre es völlig verkehrt, sich das in 20 Minuten gemeinsam anzusehen?“ Wer Nein sagen darf, fühlt sich sicher – und sagt danach erstaunlich oft Ja." [ref=e389]'
      - paragraph [ref=e390]:
        - text: Diese Techniken stammen aus der Verhandlungsführung und der Verkaufspsychologie, nicht aus Callcenter-Leitfäden, und sie lassen sich nicht als Skript verteilen – sie funktionieren nur, wenn jemand sie tausendfach geübt hat. Genau das geben wir im
        - link "B2B-Vertriebstraining" [ref=e391] [cursor=pointer]:
          - /url: /vertriebstraining-b2b/
        - text: auch an Ihr Team weiter. Mehr dazu im Ratgeber
        - link "Einwandbehandlung" [ref=e392] [cursor=pointer]:
          - /url: /einwandbehandlung/
        - text: .
    - generic [ref=e394]:
      - generic [ref=e395]:
        - paragraph [ref=e396]: Der Unterschied in Zahlen
        - 'heading "Standardagentur und DEALMAKERS: gleicher Tag, andere Zahlen" [level=2] [ref=e397]'
      - paragraph [ref=e398]: "Eine klassische Telefonakquise-Agentur arbeitet eine Liste ab: Zentrale anrufen, Vorzimmer überzeugen, Pitch aufsagen, nächste Nummer. So braucht es 60 bis 100 Wählversuche, um auf 8 bis 20 Gespräche und ein bis drei Termine am Tag zu kommen. Das ist der ehrliche Branchenwert – und der Grund, warum Telefonakquise als reines Zahlenspiel gilt."
      - paragraph [ref=e399]: "Wir drehen drei Stellschrauben, bevor überhaupt gewählt wird: Wir rufen nur an, wenn die Person gerade erreichbar ist. Wir haben Durchwahl oder Mobilnummer, also keine Zentrale dazwischen. Und wir haben einen Anlass, der den Termin von allein trägt. Wo alle drei zusammenkommen, erreichen wir teilweise 60 Prozent der Angerufenen – und aus 40 Prozent dieser Gespräche wird ein Termin."
      - 'figure "Nicht mehr wählen, sondern anders wählen: Derselbe Aufwand ergibt ein anderes Ergebnis, wenn Zeitpunkt, Nummer und Anlass vorher stimmen." [ref=e400]':

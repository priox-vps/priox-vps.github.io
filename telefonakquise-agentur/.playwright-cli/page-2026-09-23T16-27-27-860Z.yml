      - paragraph [ref=e453]: Die 60 und die 40 Prozent sind Spitzenwerte aus Projekten, in denen Zielgruppe und Datenlage sehr gut waren – kein Durchschnitt und keine Zusage. Vor dem Start nennen wir Ihnen die Bandbreite für Ihre Zielgruppe, statt eine feste Terminzahl zu versprechen und sie später über die Definition von „Termin“ zu erreichen. Bei sehr enger Zielgruppe oder hoher Komplexität liegen die Werte darunter – dafür steigt der Wert je Termin.
    - generic [ref=e455]:
      - generic [ref=e456]:
        - paragraph [ref=e457]: Transparenz
        - heading "Wie wir Qualität sichern" [level=2] [ref=e458]
      - paragraph [ref=e459]: Telefonakquise darf nicht im Bericht verschwinden. Qualität wird am Gespräch und am Übergang gemessen, nicht nur an Wählversuchen. Wir hören zu Beginn und bei Bedarf in Gespräche hinein, prüfen Notizen und besprechen wöchentlich Formulierungen, Einwände, Erreichbarkeit und Terminqualität.
      - paragraph [ref=e460]: Notizen halten Anlass, Rolle, Einwand, Terminstatus und nächsten Schritt fest. So kann Ihr Vertrieb anschließen. Das verhindert Kalenderplätze ohne Kontext.
      - paragraph [ref=e461]:
        - text: "Viele Teams haben bereits ein Lead-Scoring im CRM, in HubSpot oder in einer Tabelle. Das bleibt bestehen. Wir schärfen es nach: Der Fit beschreibt, ob ein Unternehmen grundsätzlich passt; der Anlass beschreibt, ob gerade etwas passiert ist. Live-Signale aus öffentlichen Quellen haben eigene Zeitfenster, weil Ereignisse altern. Für die Spitze folgt Tiefenrecherche, damit ein erster Satz entsteht, nicht nur eine Zahl. So werden auch passende Unternehmen sichtbar, die noch nicht im CRM stehen. Wie diese Ebene arbeitet, beschreibt"
        - link "Lead-Scoring von PrioX" [ref=e462] [cursor=pointer]:
          - /url: https://priox.ai/lead-scoring
        - text: ; die Software haben wir selbst gebaut und setzen sie selbst ein.

        - 'heading "Telefonakquise-Agentur oder Callcenter: Der Unterschied beginnt vor dem Anruf" [level=2] [ref=e132]'
      - paragraph [ref=e133]: "Ein Callcenter organisiert Reichweite. Das kann für Service oder einfache Abfragen passen. In der B2B-Terminierung für erklärungsbedürftige Angebote liegt die Arbeit jedoch im Gespräch: Anlass verstehen, Rollen einordnen, Rückfragen aufnehmen und nach dem zweiten Einwand nicht in den nächsten Datensatz wechseln. Dafür braucht es Menschen mit eigener Vertriebspraxis."
      - paragraph [ref=e134]: Bei DEALMAKERS arbeiten feste Vertriebspartner aus dem eigenen Netzwerk. Sie haben jahrelange eigene B2B-Vertriebserfahrung. Es gibt keine kurzfristig eingelernten Kräfte, keine Anwahlmaschine und keine Vorgabe für Gespräche pro Stunde. Wer nur den nächsten Haken sucht, hört den Unterschied zwischen einem endgültigen und einem noch unklaren Nein nicht.
      - figure "Telefonakquise wird dann zur Vertriebsarbeit, wenn Vorbereitung und Gesprächsführung mehr zählen als bloße Anwahlmenge." [ref=e135]:

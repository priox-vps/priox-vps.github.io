    - generic [ref=e200]:
      - generic [ref=e201]:
        - paragraph [ref=e202]: Anlass vor Liste
        - heading "Warum das Telefon im B2B weiterhin funktioniert" [level=2] [ref=e203]
      - paragraph [ref=e204]: Ein Telefonat klärt in wenigen Sätzen, ob ein Thema jetzt, später oder gar nicht relevant ist. Das funktioniert nicht durch Lautstärke oder Hartnäckigkeit, sondern wenn der Einstieg ein öffentliches Ereignis nachvollziehbar mit dem Angebot verbindet.
      - paragraph [ref=e205]:
        - text: "Wir rufen nicht nach Liste an, sondern nach Anlass. Welche Firma gerade dran ist, meldet unser eigenes Central-Sales-Intelligence-System: Es wertet laufend Millionen von Quellen mit relevanten Daten aus und erkennt mehr als 40 Arten von Anlässen – und wenn Ihr Markt 100 davon braucht, werden es 100. Wie diese Ebene arbeitet, zeigt"
        - link "PrioX" [ref=e206] [cursor=pointer]:
          - /url: https://priox.ai/
        - text: ; die Software haben wir selbst gebaut. Der Ansatz dahinter heißt
        - link "Signal Based Selling" [ref=e207] [cursor=pointer]:
          - /url: /signal-based-selling/
        - text: .
      - paragraph [ref=e208]: "Der erste Satz nennt nur dieses einzelne, offen sichtbare Ereignis, nie ein beobachtetes Muster. Etwa: „Sie haben letzte Woche zwei Stellen für den Vertrieb in Wien ausgeschrieben. Wer verantwortet bei Ihnen die Entscheidung, wie die ersten Gespräche dort entstehen?“ Oder: „Auf Ihrer Website ist die neue Produktlinie seit Montag angekündigt. Ist die Pipeline dafür bereits ein Thema bei Ihnen?“ Beide Sätze bleiben beim Anlass und überziehen ihn nicht mit einer Deutung."
      - table [ref=e210]:
